[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nodi"
version = "0.1.0"
description = "Mission-scoped authorization and execution gateway"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
lint = ["ruff==0.17.6"]
postgres = ["psycopg[binary,pool]>=3.3,<4"]
mcp = ["mcp>=2.3,<3"]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "hypothesis>=6.100,<7"]

[tool.setuptools.packages.find]
include = ["nodi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
nodi = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.png", "web/*.ico"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these objects as declarative parameter metadata, not mutable state.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]
