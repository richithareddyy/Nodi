name: Enforcement tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: nodi-ci
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,mcp]' -c requirements.lock
      - run: python -m pytest -q
      - run: python -m nodi evaluate
      - run: python -m nodi evaluate --domain research
      - run: python -m nodi policy validate examples/policies/procurement.json
      - run: python -m nodi policy validate examples/policies/research.json
      - run: python -m nodi demo
      - run: python -m benchmarks.injection.runner --output /tmp/nodi-injection-skip
      - run: python -m benchmarks.purpose.run --output /tmp/nodi-purpose.json
      - run: python -m nodi.capability_demo
      - run: python -m nodi.outbox_demo
      - run: python -m nodi policy validate examples/policies/payments.json
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/check_wheel.py dist/nodi-0.1.0-py3-none-any.whl

  docker-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' -c requirements.lock
      - run: docker compose -f docker/compose.sandbox.yml up -d --build --wait
      - name: Test real read-only containers through the gateway
        run: |
          export NODI_TEST_SANDBOX_IMAGE=$(docker image inspect nodi-readonly:local --format '{{.Id}}')
          python -m pytest -q tests/integration/test_docker_readonly.py
      - name: Remove test proxy and private socket volume
        if: always()
        run: docker compose -f docker/compose.sandbox.yml down --volumes

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.14']
    env:
      HYPOTHESIS_PROFILE: nodi-ci
      NODI_TEST_POSTGRES_DSN: postgresql://postgres:nodi-ci-local@127.0.0.1:5432/nodi
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_PASSWORD: nodi-ci-local
          POSTGRES_DB: nodi
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d nodi" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,mcp,postgres]' -c requirements.lock
      - run: python -m pytest -q
      - run: docker compose -f docker/compose.sandbox.yml up -d --build --wait
      - name: Test real read-only containers with PostgreSQL ledger
        run: |
          export NODI_TEST_SANDBOX_IMAGE=$(docker image inspect nodi-readonly:local --format '{{.Id}}')
          python -m pytest -q tests/integration/test_docker_readonly.py
      - name: Remove PostgreSQL job's test proxy
        if: always()
        run: docker compose -f docker/compose.sandbox.yml down --volumes
